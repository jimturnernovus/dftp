version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /examples/vite-react
    schedule:
      interval: monthly
    allow:
      - dependency-type: development
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
