<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture: app shell with its own scroller</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>
  <div class="app">
    <header class="top"><h1 id="title">Shell page</h1></header>
    <div class="body">
      <nav class="side"></nav>
      <main class="scroller" id="scroller">
        <section class="card" id="card">
          <p id="first">First line in the card</p>
          <p id="second">Second line in the card</p>
          <p id="third">Third line in the card</p>
        </section>
        <div class="filler"></div>
      </main>
    </div>
  </div>
</body>
</html>
